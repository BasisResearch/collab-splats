name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y pandoc

      - name: Install docs dependencies
        run: |
          pip install --upgrade pip
          pip install sphinx pydata-sphinx-theme myst-parser nbsphinx ipython
          # Unmocked deps conf.py leaves real; the rest are autodoc mocks
          pip install numpy zarr numcodecs av pyarrow matplotlib seaborn pandas pyyaml

      - name: Build docs
        run: sphinx-build -b html docs/source docs/_build/html --keep-going

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
