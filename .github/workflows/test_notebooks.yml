name: Test Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_notebooks:
    runs-on: [self-hosted, gpu]

    steps:
      - uses: actions/checkout@v4

      # Runner image already holds the full env (bash setup.sh); use it as-is
      - name: Use project venv
        run: echo "/opt/venv/reconstruction/bin" >> "$GITHUB_PATH"

      # Run tests
      - name: Test
        run: |
          make test-notebooks