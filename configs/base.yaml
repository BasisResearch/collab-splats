# Base configuration for Reconstructor pipelines.
# All dataset configs inherit from this and override specific values.
#
# This file is the SINGLE SOURCE OF DEFAULTS. Reconstructor.__init__ deep-merges
# any passed config over these values — do not duplicate defaults in Python code.
#
# Required per run (no defaults — Reconstructor.validate_config() raises if null):
#   input_path  — absolute path to input video or image directory
#   output_path — absolute path to output root (created if absent)
#
# See configs/README.md for full documentation.

input_path: null
output_path: null

preproc:
  # Output: images/frame_NNNNNN.png
  frame_selection: fps        # fps | uniform | optical_flow
  fps: 2.0                    # fps only: samples per second; fixes spacing, count floats
  min_frames: null            # fps only: floor on the count; null honors fps literally
  max_frames: 300             # frame budget: count for uniform, ceiling otherwise; also caps loger
                              # vggt_omega OOMs above ~300
  n_workers: 16               # quality report and selection decode: parallel ranges; 1 = serial (use during GPU runs)
  undistort: false            # self-calibrate, then rewrite images/ undistorted (COLMAP framing)
                              # existing images/ needs overwrite=True; localize queries stay raw
  on_empty_slot: rescue       # fps only: rescue keeps an all-ineligible slot's sharpest frame, drop skips it
  quality:                    # eligibility gate every sampler picks from
    sharpness_k: 2.0          # MAD z-score cut on log(laplacian); larger keeps more
    max_clipped_frac: 0.25    # ceiling on clipped_low_frac + clipped_high_frac; larger keeps more

pointcloud:
  method: feedforward         # feedforward | sfm
  backend: vggt_omega         # feedforward: vggt_omega | vggtx | mapanything | loger
                              # sfm: instantsfm | colmap | hloc
  # Per-backend creator kwargs; only the block matching `backend` is read
  # max_points is NOT settable here — it is a pipeline-level guard below.
  vggt_omega: {}
  vggtx: {}
  mapanything: {}
  loger:
    variant: LoGeR_star       # LoGeR | LoGeR_star (SE(3)); selects config AND weights
    window_size: 32           # sliding-window length; upstream default, see README
    overlap_size: 3           # frames shared between adjacent windows
    reset_every: 0            # hard-reset TTT fast weights every N frames; 0 = never
    conf_threshold: 50.0      # depth-confidence percentile
  loop_closure: false
  # Final point count cap (BasePointcloudCreator.max_points), drawn after the SOR clean, every method.
  # Lower it on small-GPU/RAM machines.
  max_points: 500000
  # Cross-view depth consistency filter (feedforward only); 0 = off
  # - keeps a pixel when min(min_views, seen) other views agree within mv_rel_thresh
  # - off: on chess/seq-01 it cuts the >10%-error fraction ~5% for ~2% of pixels at O(N^2)
  min_views: 0
  mv_rel_thresh: 0.01
  viz:
    enabled: false          # instantiate the viser Viewer during loop closure
    port: 8080              # viser server port
  # LM bundle adjustment (leaf stage `refine`); rewrites pointcloud.zarr whole, dropping the localization DB; with loop_closure on, runs inside each LC window instead (no refine stage)
  bundle_adjustment:
    enabled: false
    track_source: xfeat        # vggsfm | xfeat | loma (matcher star tracks, geometry/tracks.py)
    track_kwargs: {}           # source-specific; empty = defaults. vggsfm: max_query_pts, query_frame_num, fine_tracking; xfeat/loma: retrieval, seed_fraction, window, retrieval_k
    vis_thresh: 0.2            # min track score for an observation (VGGSfM visibility; matcher tracks score 1.0)
    max_reproj_error: 4.0      # pre-solve pixel reprojection gate; null skips the filter
    min_inliers_per_frame: 64  # frames below this inlier count sit out the solve
    solver: schur              # schur eliminates points (less GPU); lm solves the joint system
    dtype: float64             # solve precision: float32 | float64
    lm_steps: 40               # max LM steps without photometric; photometric runs up to its 30-step schedule
    lm_tol: 1.0e-4             # relative loss drop below which an LM step counts as stalled
    lm_patience: 2             # stalled steps in a row that end the solve, or one photometric re-sample
    increment_size: 0          # 0 = one global solve; N = frames added per incremental solve
    shared_camera: true        # one focal per scene; false = one per frame
    refine_focal: false        # solve for focal; false holds the input mean focal fixed
    use_depth: true            # track camera z against feedforward depth
    depth_sigma: 0.01          # relative depth error weighted like 1 px
    use_photometric: true      # brightness matching between overlapping frames; not with increment_size > 0
    device: null               # CUDA device; null = auto (bae LM is CUDA-only)
  clean:
    enabled: true              # statistical outlier removal on the final sparse point set
  # InstantSfM global SfM (method: sfm, backend: instantsfm)
  instantsfm:
    retriangulation: false        # GLOMAP-style retriangulate + up to 5 further BA rounds; extra runtime
    random_seed: null             # seeds InstantSfM's RUNTIME_OPTIONS; null = upstream's unseeded init
    min_num_view_per_track: null  # drop thinner tracks before BA, the memory lever; null = upstream's 3
    pairing: exhaustive           # sequential | retrieval | sequential+retrieval | exhaustive
    overlap: 10                   # sequential: pair each frame with the next N
    num_retrieved: 20             # retrieval: vocab-tree neighbors per image (9.5 MB tree, fetched once)
    min_registered_frac: 0.5      # fail below this share of frames registered; above it, subset
    num_threads: 8                # CPU SIFT thread cap; the GPU path ignores it
  # COLMAP incremental SfM (method: sfm, backend: colmap): pycolmap SIFT + pycolmap mapper.
  colmap:
    pairing: sequential+retrieval  # sequential | retrieval | sequential+retrieval | exhaustive
    overlap: 10              # sequential: pair each frame with the next N
    num_retrieved: 20        # retrieval: vocab-tree neighbors per image (9.5 MB tree, fetched once)
    num_threads: 8           # CPU SIFT/mapper thread cap; colmap's default is one thread per host core
    min_registered_frac: 0.5 # fail below this share of frames registered; above it, subset
  # hloc incremental SfM (method: sfm, backend: hloc): learned features + pycolmap mapper.
  # Needs the optional `hloc` extra (setup/hloc.sh, then the user-run uv lock + sync).
  hloc:
    pairing: sequential+retrieval  # sequential | retrieval | sequential+retrieval | exhaustive
    overlap: 10              # sequential: pair each frame with the next N
    num_retrieved: 20        # retrieval: top-k global-descriptor neighbors per image
    retrieval_conf: netvlad  # hloc.extract_features.confs key
    feature_conf: superpoint_max          # hloc.extract_features.confs key
    matcher_conf: superpoint+lightglue    # hloc.match_features.confs key
    num_threads: 8           # pycolmap mapper thread cap
    min_registered_frac: 0.5 # fail below this share of frames registered; above it, subset

semantics:
  enabled: true
  extractor: talk2dino        # talk2dino | dinov2 | maskclip | ocr_lens
  extractor_kwargs: {}        # constructor kwargs, e.g. {layer: 20} for ocr_lens; keys the 2D cache
  n_components: 64            # AE code width stored in <extractor>_codes.zarr; null = full width; 128 for ocr_lens; changing it re-extracts
  # Stop training once mean reconstruction cosine hits this, with max_epochs as the
  # ceiling. Cross-scene comparison happens in decoded 768-D space, so fidelity is the
  # right stop signal — more epochs cannot align two scenes' 64-D bases.
  # NOTE: the cosine is measured on the TRAINING set, so this gate is optimistic on small
  # scenes — few-hundred-patch fits can hit 1.0 in-sample while generalizing far worse.
  # At production scale (10^5–10^6 patches through 768→64) the in/out-of-sample gap
  # largely collapses; on tiny scenes read a passing target as "fit completed", not
  # "features are trustworthy".
  target_cosine: 0.95
  max_epochs: 100

mesh:
  enabled: true
  source: feedforward      # feedforward | splats
  voxel_depth_px: 4.0      # TSDF voxel edge in depth-pixel footprints (depth / fx of the depth's own grid)
  voxel_ref_percentile: 50 # depth percentile that footprint is measured at; lower = finer near surfaces
  sdf_trunc_mult: 4.0      # truncation band = this x the voxel. Sets the thin-structure floor:
                           # a TSDF cannot resolve anything thinner than 2 x sdf_trunc, and where
                           # both the front and back surface fall inside one band they cancel and
                           # the structure vanishes. 4.0 is Open3D's default for noisy sensor RGBD
                           # and makes the band 8 voxels wide — 4x coarser than the grid itself.
                           # Rendered splat depth is far cleaner, so 1.5-2.0 recovers thin geometry
                           # (fence posts, railings) at the SAME voxel size and memory.
  depth_trunc_percentile: null  # ignore depth beyond this percentile of the fused depth; null = keep all
  conf_percentile: 20      # drop depth below this confidence percentile (null = off); feedforward only
  mask_sky: true           # zero depth where the `skywater` segmenter fires, before fusion; both
                           # mesh sources. Unlike conf_percentile it does NOT mask the splats
                           # stage's depth targets — see docs/mesh.md.
  max_faces: 1500000       # face budget for mesh.ply after the error-bounded decimation; null = none
  smooth_iterations: 10    # Taubin smoothing passes on mesh.ply after repair, before texturing; 0 = off
  texture: true            # UV atlas + project the fused views onto mesh.ply; writes texture/; CUDA only
  use_convex_hull: true    # trim the ragged outer edge, patch the ground out to a rounded hull;
                           # ground-dominated height-field scenes only; set false indoors and for objects (raises)

# Gaussian splats from the pointcloud stage (leaf stage `splats`, upstream gsplat)
# - photometric 0.8 L1 + 0.2 (1 - SSIM) always on; a loss is active iff weight > 0 and step >= start
# - depth targets: pointcloud.zarr depth masked by mesh.conf_percentile
# - 3dgs densifies with MCMC (cap_max), 2dgs with DefaultStrategy (grow_grad2d) + distortion loss
splats:
  enabled: false
  primitive: 3dgs            # 3dgs (fast kernel, antialiased) | 2dgs (surface-aligned)
  representation: vanilla    # vanilla (per-gaussian) | scaffold (anchors + MLP; set losses.opacity_reg 0)
  # scaffold:
  #   n_offsets: 10
  #   feat_dim: 32
  #   voxel_multiplier: 1.0     # x median kNN spacing of the seed points
  #   update_from: 1500
  #   update_until: 15000
  #   refine_every: 100
  #   grad_threshold: 2.0e-4
  #   min_opacity: 0.005
  #   update_init_factor: 16    # level-0 growing grid, in voxels; later levels shrink it
  #   success_threshold: 0.8    # fraction of a refine window a slot/anchor must be seen for
  #   appearance_dim: 32        # Scaffold's per-image embedding, 0 = off; indep. of appearance_opt
  max_steps: 30000
  pose_opt: true             # refine camera poses jointly (CameraOpt)
  appearance_opt: false      # per-image affine color, train views only; regularized by losses.appearance_reg
  sh_degree: 3               # vanilla only; a scaffold override raises
  sh_degree_interval: 1000   # vanilla only; a scaffold override raises
  init_opacity: 0.1
  means_lr: 1.6e-4           # x scene_scale, decays 0.01x over the run
  scales_lr: 5.0e-3
  quats_lr: 1.0e-3
  opacities_lr: 5.0e-2
  sh0_lr: 2.5e-3
  shN_lr: 1.25e-4
  pose_lr: 1.0e-5            # rotation x world-frame camera extent, translation x scene_scale
  appearance_lr: 1.0e-3
  cap_max: 1000000           # 3dgs only: Gaussian budget
  grow_grad2d: 2.0e-4        # 2dgs only: gsplat's non-absgrad default
  num_downscales: 2          # coarse-to-fine (splatfacto): start at 1/2^n res; 0 disables
  resolution_schedule: 3000  # steps per resolution doubling
  normalize_scene: false     # splatfacto Sim3 to a unit cube; outputs mapped back to world units
  log_every: 500
  # Each loss: {weight[, start, end, end_weight]}; with end, weight decays log-linearly to end_weight
  # e.g. depth: {weight: 0.01, end: 12000, end_weight: 0.001}
  losses:
    depth: {weight: 0.01}
    normal_consistency: {weight: 0.05, start: 7000}   # depth_ratio (2dgs only) blends in the median-depth normal
    opacity_reg: {weight: 0.01}
    scale_reg: {weight: 0.01}
    appearance_reg: {weight: 1.0e-3}   # no-op unless appearance_opt
    # 2dgs: replace the two regularizers with  distortion: {weight: 0.01, start: 3000}

localization:
  enabled: false
  # vismatch model name: only batch-capable xfeat | loma (cached-feature matching)
  matcher: loma
  retrieval: dino-salad   # retrieval registry name: dino-salad | megaloc

reconstruction_quality_report:
  min_pair_overlap: 0.0   # 0 = every ordered pair; >0 skips pairs whose frustum overlap is below it
