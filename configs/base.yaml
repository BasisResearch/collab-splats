# Base configuration for Reconstructor pipelines.
# All dataset configs inherit from this and override specific values.
#
# This file is the SINGLE SOURCE OF DEFAULTS. Reconstructor.__init__ deep-merges
# any passed config over these values — do not duplicate defaults in Python code.
#
# Required per run (no defaults — Reconstructor.validate_config() raises if null):
#   input_path  — absolute path to input video or image directory
#   output_path — absolute path to output root (created if absent)
#
# See configs/README.md for full documentation.

input_path: null
output_path: null

preproc:
  # Output: <output_path>/frames.zarr — canonical decode-once keyframe store
  # (chunked images + selection records + provenance); no images/ JPG dir.
  #
  # Each method has ONE density knob. max_frames is the frame budget: the target
  # COUNT for 'uniform', a ceiling for 'fps' and 'optical_flow'.
  frame_selection: fps        # fps | uniform | optical_flow
  fps: 2.0                    # 'fps' only: samples/second. Fixes the baseline between
                              # consecutive frames regardless of video length — which a
                              # count-based knob cannot do.
  min_frames: null            # 'fps' only: floor on the resulting count. null = fps is
                              # honoured literally (a floor would make it a hint).
  max_frames: 300             # frame budget; vggt_omega OOMs above ~300 on a 44 GB GPU.
                              # NOT a LoGeR limit — LoGeR is windowed and built for longer
                              # sequences — but preproc runs first, so it binds LoGeR too.
                              # See configs/README.md.
  n_workers: 4                # quality report only: decode+measure this many frame ranges in
                              # parallel. 1 = serial. Measured on a 2388-frame 1080x1920 video:
                              # 2 -> 1.90x, 4 -> 3.04x (best), 6 -> 2.95x, 12 -> 2.06x. NOT
                              # auto-derived — os.cpu_count() reports HOST cores inside a
                              # container and ignores the cgroup quota. Set to 1 while a GPU
                              # eval run is using the machine (CLAUDE.md: OOM risk).
  search_radius: 7            # fps/uniform: each target is replaced by the sharpest usable
                              # frame within +-search_radius, auto-capped below half the target
                              # spacing (2 fps on 30 fps video -> spacing 15 -> +-7 is the max).
  undistort: false            # self-calibrate one shared OPENCV camera (pycolmap, <=60 frames)
                              # and undistort every selected frame (cv2, alpha=0 crop) before
                              # frames.zarr is written. Off until the GH010229 A/B measures the
                              # win. frames.zarr reuse is by EXISTENCE — toggling this on an
                              # existing scene needs preprocess(overwrite=True). Localization
                              # QUERY images are NOT undistorted (they never pass through here).

pointcloud:
  method: feedforward         # feedforward | sfm
  backend: vggt_omega         # feedforward: vggt_omega | vggtx | mapanything | loger
                              # sfm: instantsfm (colmap | hloc not implemented)
  # Per-backend creator kwargs. Only the block matching `backend` is read, so all
  # four can be documented here at once. max_points is NOT settable here — it is a
  # pipeline-level guard below.
  loger:
    variant: LoGeR_star       # LoGeR | LoGeR_star (SE(3)); selects config AND weights
    window_size: 32           # sliding-window length; upstream default, see README
    overlap_size: 3           # frames shared between adjacent windows
    reset_every: 0            # hard-reset TTT fast weights every N frames; 0 = never
    conf_threshold: 50.0      # depth-confidence PERCENTILE when > 1.0; a value <= 1.0 is
                              # read as a RAW confidence instead. LoGeR's post-sigmoid
                              # confidences sit in ~[0.014, 0.117], so a raw 1.0 keeps
                              # nothing — do not write 1.0 meaning "1st percentile".
  loop_closure: false
  # Inference-time memory guard: caps the confidence mask so a full-resolution cloud is
  # never materialised (BaseFeedforwardCreator.max_points). Lower it on small-GPU/RAM machines.
  max_points: 500000
  # Geometric cross-view depth consistency filter. Drops points whose depth disagrees with
  # the other views that see them. rel_thresh and min_views are calibrated per-backend
  # creator defaults, deliberately not exposed here.
  # Off: measured on 7-Scenes chess/seq-01 it cuts the >10%-error pixel fraction by ~5% for
  # ~2% of pixels — real but small, and it costs O(N^2) pairwise warping. The learned
  # confidence percentile is the stronger filter; mv is complementary and ANDed on top.
  # See docs/superpowers/specs/2026-08-13-multiview-confidence-measured-report.md, Step D.
  use_multiview_confidence: false
  # Geometric verification: triangulate independent feature tracks (the localization
  # extractor's — shared zarr cache, one extraction serves both stages) against the final
  # poses via pycolmap. Writes <backend>/colmap/{verified/, verification.json, database.db}.
  # Reports only — never gates the pipeline or mutates model outputs (pointcloud.zarr,
  # sparse_pc.ply, mesh untouched). Off until the first measured report justifies a default.
  geometric_verification: false
  viz:
    enabled: false          # instantiate the viser Viewer during loop closure
    port: 8080              # viser server port
  # LM bundle adjustment pose refinement (leaf stage `refine`; runs inline after the
  # pointcloud stage when enabled here, or standalone via --stages refine). Rewrites
  # COLMAP/sparse_pc.ply/pointcloud.zarr poses in place. Mutually
  # exclusive with loop_closure. Knobs stay on BundleAdjustmentConfig defaults
  # (global BA; tracks cached in <backend>/).
  bundle_adjustment: false
  clean:
    enabled: true              # statistical outlier removal on the final sparse point set
  # InstantSfM (method: sfm, backend: instantsfm) config surface.
  instantsfm:
    features: colmap          # feature/matching handler; v0.3.0 upstream supports only colmap
                               # (CPU SIFT + exhaustive matching) — the value is validated but
                               # not yet dispatched on.
    retriangulation: false    # GLOMAP-style post-BA refinement: retriangulate tracks from the
                               # full pre-filter set + up to 5 further BA rounds (upstream
                               # skip_retriangulation flag). Costs extra runtime.
    depth_align: scale        # scale | affine — how VDA metric depth is mapped to the
                              # COLMAP world. 'scale' fits one robust multiplier per frame.
                              # 'affine' fits 1/d_colmap ~= a*(1/d_vda) + b per frame, the
                              # space gsplat's depth_l1_loss is actually paid in; measured
                              # 2026-08-26 it cuts the irreducible depth-loss floor 18.9%
                              # pooled and 28.8% in the near field. 'affine' also writes 0
                              # (= no target) for pixels past its saturation horizon and past
                              # the furthest surviving track observation — one-sided, far side
                              # only, because tracks do not cover close surfaces and a
                              # near-side bound would delete the near field this sharpens.
    random_seed: null         # seed InstantSfM's RUNTIME_OPTIONS (numpy/random/torch/cuda).
                              # InitializeRandomPositions draws unseeded, so two runs of the
                              # same scene differ. null = upstream behaviour (unseeded).

semantics:
  enabled: true
  extractor: talk2dino        # talk2dino | dinov2 | maskclip
  n_components: 64            # autoencoder latent dim; null = no compression
  # Stop training once mean reconstruction cosine hits this, with max_epochs as the
  # ceiling. Cross-scene comparison happens in decoded 768-D space, so fidelity is the
  # right stop signal — more epochs cannot align two scenes' 64-D bases.
  # NOTE: the cosine is measured on the TRAINING set, so this gate is optimistic on small
  # scenes — few-hundred-patch fits can hit 1.0 in-sample while generalizing far worse.
  # At production scale (10^5–10^6 patches through 768→64) the in/out-of-sample gap
  # largely collapses; on tiny scenes read a passing target as "fit completed", not
  # "features are trustworthy".
  target_cosine: 0.95
  max_epochs: 100

mesh:
  enabled: true
  source: feedforward     # feedforward (model depth) | splats (rendered depth; alpha = confidence)
  voxel_size: 0.0025         # dashboard-parity TSDF defaults
  sdf_trunc: 0.01
  depth_trunc: 1.5          # drop depth samples beyond this range (metres)
  clean_repair: true       # drop out-of-bounds components + fill small holes, rewriting mesh.ply
  conf_percentile: 20    # mask depth below this global confidence percentile (null = off)
  native_resolution: true # fuse at original frame resolution (frames.zarr RGB + upsampled depth)
  color_map_iterations: 300  # rigid color-map optimization iterations after fusion (0 = off)
  splat_depth: expected    # source: splats only — 'expected' (alpha-weighted rendered
                           # depth) or 'median' (RaDe-GS surface depth; 2dgs renders only).
  # source: splats only — opt-in pre-fusion depth cuts, both ratios rather than distances.
  # Both ship off: measured on GH010229, clean_repair already removes everything they remove.
  # frac cuts depth past that fraction of the camera trajectory's extent, but depth_trunc
  # above is the tighter of the two far gates unless it is set beyond the trajectory. grad
  # cuts neighbour pairs jumping by more than that fraction of their own depth — it must
  # clear the scene's real grazing-angle gradient (~0.03 here) or it deletes whole surfaces
  # instead of silhouettes; 0.05 removed visible patches of good mesh.
  splat_max_depth_frac: null
  splat_max_depth_grad: null

# Gaussian splats trained from the pointcloud stage (leaf stage `splats`, upstream gsplat).
# Photometric (0.8 L1 + 0.2 SSIM) is always on; each loss below is active iff weight > 0 and
# step >= start. Depth targets = feedforward depth masked by mesh.conf_percentile.
# 3dgs densifies with MCMC (fixed budget cap_max; needs opacity_reg/scale_reg), 2dgs with
# gsplat's DefaultStrategy (grow_grad2d) and gets the distortion loss instead.
splats:
  enabled: false
  primitive: 3dgs            # 3dgs (fast kernel, antialiased) | 2dgs (surface-aligned)
  # representation: vanilla (per-gaussian parameters) | scaffold (anchors + MLP decode).
  # scaffold ignores sh_degree — its colours come from mlp_colour — and densifies anchors
  # rather than gaussians. Set losses.opacity_reg to 0 under scaffold: opacity is decoded and
  # its sign is the offset visibility mask, so regularising it shuts offsets.
  representation: vanilla
  # scaffold:
  #   n_offsets: 10
  #   feat_dim: 32
  #   voxel_multiplier: 1.0     # x median kNN spacing of the seed points
  #   update_from: 1500
  #   update_until: 15000
  #   refine_every: 100
  #   grad_threshold: 2.0e-4
  #   min_opacity: 0.005
  #   update_init_factor: 16    # level-0 growing grid, in voxels; later levels shrink it
  #   success_threshold: 0.8    # fraction of a refine window a slot/anchor must be seen for
  #   appearance_dim: 0         # Scaffold's per-image embedding; independent of appearance_opt
  max_steps: 30000
  pose_opt: true             # refine camera poses jointly (CameraOptModule). +2.2 dB on a
                             # 300-frame GoPro scene, +0.4 dB on the 30-frame tutorial, ~+3% time.
  appearance_opt: false      # per-image affine colour (gain + bias per channel) to absorb
                             # exposure / white-balance drift. Train views only — novel views
                             # render uncorrected. Regularised by losses.appearance_reg.
  sh_degree: 3
  sh_degree_interval: 1000
  init_opacity: 0.1
  means_lr: 1.6e-4           # x scene_scale, decays 0.01x over the run
  scales_lr: 5.0e-3
  quats_lr: 1.0e-3
  opacities_lr: 5.0e-2
  sh0_lr: 2.5e-3
  shN_lr: 1.25e-4
  pose_lr: 1.0e-5            # x world-frame camera extent (also under normalize_scene)
  appearance_lr: 1.0e-3
  cap_max: 1000000           # 3dgs only: Gaussian budget
  grow_grad2d: 2.0e-4        # 2dgs only (gsplat non-absgrad default; 8e-4 starved densification)
  num_downscales: 2          # coarse-to-fine (splatfacto): start at 1/4 res, double every
  resolution_schedule: 3000  # this many steps until native. 0 disables.
  normalize_scene: false     # splatfacto Sim3 normalisation (centre on cameras, unit cube,
                             # scene_scale = 1); outputs are mapped back to world units
  log_every: 500
  # Each entry: {weight[, start, end, end_weight]} — with end the weight decays log-linearly
  # from weight at start to end_weight at end and holds there (e.g. fade the depth prior:
  # depth: {weight: 0.01, end: 12000, end_weight: 0.001}). normal_consistency additionally
  # accepts depth_ratio (2dgs only, default 0): the RaDe-GS blend weight on the median-depth
  # normal, (1-r)*cos(n, dn_expected) + r*cos(n, dn_median).
  losses:
    depth: {weight: 0.01}
    normal_consistency: {weight: 0.05, start: 7000}
    opacity_reg: {weight: 0.01}
    scale_reg: {weight: 0.01}
    appearance_reg: {weight: 1.0e-3}   # no-op unless appearance_opt
    # 2dgs: replace the two regularisers with  distortion: {weight: 0.01, start: 3000}
    # PGSR (3dgs only — GS-SR pairs it with the vanilla rasterizer, there is no 2dgs-pgsr):
    #   pgsr_normal:    {weight: 0.015, start: 7000}
    #   pgsr_multiview: {weight: 1.0, start: 7000, geo: 0.03, ncc: 0.15}
    # pgsr_normal flattens surfaces against their own plane depth, weighted towards flat image
    # regions. pgsr_multiview is upstream's two multi-view terms in ONE entry, because both come
    # from one shared correspondence pass: geo is the round-trip reprojection error against a
    # co-visible neighbour and ncc the patch photometric error through the plane homography (its
    # own weight multiplies their sum). It renders a second view every step, so expect ~2x the
    # step cost from `start` on. Extra keys: pixel_noise_threshold (1.0 px), num_sample (102400),
    # patch_size (3 = 7x7 patches), num_multi_view (5) and max_points (20000) for the one-time
    # neighbour selection.

localization:
  enabled: false
  # vismatch model name (e.g. loma, xfeat, disk-lightglue, aliked-lightglue) —
  # matched pairwise against the retrieval top-K. Some models are blocked
  # (license/deps) — see _VISMATCH_*_BLOCKLIST in localization/extractors.py.
  matcher: loma
  top_k: 8  # refs matched per query
