# Live-viewer loop-closure override (merged over configs/base.yaml).
# Watch the scene build in a browser: submaps appear as they're added, loop lines
# draw when loop closure fires, and each loop corrects the scene live.
#
#   python docs/examples/run_pipeline.py --config configs/viewer.yaml \
#       --stages preprocess,pointcloud --keep-viewer /path/to/scene.MP4
#
# loop_edge_timing is forced to "live" automatically whenever viz.enabled + loop_closure
# (reconstructor.py) — no need to set it here.
pointcloud:
  loop_closure: true
  viz:
    enabled: true
    port: 8080
