# Base configuration for Reconstructor pipelines.
# All dataset configs inherit from this and override specific values.
# Required per dataset: input_path, output_path

preprocessing:
  frame_selection: fps
  fps: 1.0
  min_frames: 300
  max_frames: null

pointcloud:
  method: feedforward
  backend: vggtx
  bundle_adjustment: false
  loop_closure: false
  clean:
    enabled: true
    outlier_removal: true
    voxel_size: null
    confidence_threshold: null

semantics:
  enabled: false
  extractor: dinov2
  n_components: 64
  resolution: 1024

mesh:
  enabled: false
  mesher: tsdf
  voxel_size: 0.01
  sdf_trunc: 0.04

localization:
  enabled: false
  extractor: dinosalad

nerfstudio:
  sfm_tool: hloc
  train_method: rade-features
