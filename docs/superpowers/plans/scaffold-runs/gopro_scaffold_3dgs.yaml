# Scaffold-GS on 3dgs, GoPro parity run (Task 13 of the scaffold-gs plan).
# Baseline to beat, from the logged splatfacto-parity runs — do NOT rerun it:
#   vanilla 3dgs GH010229  psnr 21.606  ssim 0.7169  1,000,000 gaussians  601 s
# The appearance sweep is this file x {scaffold.appearance_dim: 0 | 32} x {appearance_opt: false | true}.
splats:
  enabled: true
  primitive: 3dgs
  representation: scaffold
  appearance_opt: true
  max_steps: 30000
  pose_opt: true
  normalize_scene: false
  num_downscales: 2
  resolution_schedule: 3000
  scaffold:
    n_offsets: 10
    feat_dim: 32
    appearance_dim: 0
  losses:
    depth: {weight: 0.01}
    opacity_reg: {weight: 0.01}
    scale_reg: {weight: 0.01}
    appearance_reg: {weight: 1.0e-3}

semantics:
  enabled: false
