# RGB-D BA grid: VGGT-Omega poses per BA term set, 200 frames in one pass (no loop closure)
name: rgbd_ba
output_dir: evals/results/rgbd_ba_grid

# Applied to every cell before its condition
base:
  semantics: {enabled: false}
  mesh: {enabled: false}
  pointcloud:
    backend: vggt_omega

datasets:
  - {name: chess,  type: 7scenes, seq_dir: data/7scenes/chess/seq-01,  max_frames: 200}
  - {name: fire,   type: 7scenes, seq_dir: data/7scenes/fire/seq-01,   max_frames: 200}
  - {name: office, type: 7scenes, seq_dir: data/7scenes/office/seq-01, max_frames: 200}

# Label -> override merged over base
conditions:
  omega: {}
  omega_reproj:
    pointcloud: {bundle_adjustment: {enabled: true, use_photometric: false, use_depth: false}}
  omega_reproj_depth:
    pointcloud: {bundle_adjustment: {enabled: true, use_photometric: false}}
  omega_joint:
    pointcloud: {bundle_adjustment: {enabled: true}}
