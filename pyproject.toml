[project]
name = "collab_splats"
version = "0.0.1"
description = "ns-extension: Extension tools and models for nerfstudio"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["gaussian splatting", "depth rasterization", "mesh"]
authors = [
    { name = "Tommy Botch", email = "tommy@basis.ai" },
]

dependencies = [
    # setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
    # which setuptools 70+ removed. See [build-system] comment.
    "setuptools<70.0",
    "einops",
    "ftfy",
    "gdown",
    "matplotlib",
    "mergedeep",
    "numpy>=1.26",
    "zarr>=2.16",
    "numcodecs",
    "scipy>=1.11",
    "lightning",
    "pillow",
    "regex",
    "tqdm",
    "huggingface_hub",
    "ultralytics",
    "gradio",
    "pyvista[jupyter]",
    "pyntcloud",
    "trame",
    "trame-vuetify",
    "trame-vtk",
    "meshlib>=3.1",
    "python-dotenv",
    "hydra-core",
    "omegaconf",
    "onnxruntime",
    "requests",
    "trimesh",
    "pydantic==2.10.6",
    "pyyaml",
    "pycolmap>=3.1",
    "transformers>=4.30,<5.0",
    "timm>=0.9,<2.0",
    "opencv-python",
    "scikit-learn",
    "roma",
    "kornia",
    "mobile_sam @ git+https://github.com/ChaoningZhang/MobileSAM.git",
    # torchpack: implicit dep of mobilesamv2 (loaded via torch.hub for SAM segmentation).
    # mobilesamv2/efficientvit/models/nn/drop.py imports torchpack.distributed at module level,
    # so it must be installed before any import of mobilesamv2.
    "torchpack",
    # gsplat-rade fork (version 1.4.0) must be pre-installed with --no-build-isolation
    # before this package. See setup_nerfstudio.sh. Git URL removed here because pip
    # always rebuilds git-URL deps even if already installed, failing without build isolation.
    "gsplat>=1.4.0",
    "maskclip_onnx @ git+https://github.com/RogerQi/maskclip_onnx.git",
    "pypose",
    # bae requires --no-build-isolation at build time (setup.py imports torch at
    # top level to query CUDA ABI). Pre-installed by Dockerfile.cu121 Stage 2.
    # Git URL removed: pip rebuilds git-URL deps even if installed, failing without
    # build isolation. bae>=0.2.4 is pre-installed at /opt/bae.
    "bae>=0.2.4",
    # cuDSS runtime dep for bae. Must be installed before `pip install -e bae`
    # so find_cudss_root() finds headers at site-packages/nvidia/cu12.
    # 0.6.0.5 and 0.7.1.6 both verified by bae README; pinned for ABI stability.
    "nvidia-cudss-cu12==0.6.0.5",
    "clip @ git+https://github.com/openai/CLIP.git",
]

[project.optional-dependencies]
feedforward = [
    # vggt-x and mapanything — git deps, install via setup_feedforward.sh
    # vggt @ third_party/VGGT-X submodule (--no-deps, pinned commit)
    # mapanything @ git+https://github.com/facebookresearch/map-anything.git (--no-deps)
    # lightglue @ git+https://github.com/cvg/LightGlue.git (--no-deps, mapanything colmap extra)
    "uniception==0.1.7",
    "viser>=0.2.23",
    "evo",
    "pyliblzfse",
    "safetensors",
    "natsort",
    "orjson",
    "pillow-heif",
    "plyfile",
    "tensorboard",
    "python-box",
    "open3d",
    # rerun-sdk excluded: only used in mapanything viz/dataset code, not in reconstruction pipeline
    "gtsam-develop",
    # salad (Dominic101/salad) installed via setup_feedforward.sh.
    # pytorch-metric-learning is salad's only non-torch runtime dep.
    "pytorch-metric-learning",
]

dashboard = [
  "panel>=1.3.0",
  "param>=2.0.0",
]

docs = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
]

dev = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "mypy",
  "ruff",
  "nbval",
  "nbqa",
  "black",
  "isort",
  "flake8>=6.0",
  "types-PyYAML",
]

[tool.black]
line-length = 120

[project.scripts]
collab-dashboard = "collab_splats.dashboard.__main__:main"

[project.entry-points."nerfstudio.method_configs"]
rade-gs = "collab_splats.nerfstudio.method_configs.rade_gs:rade_gs_method"
rade-features = "collab_splats.nerfstudio.method_configs.rade_features:rade_features_method"

[tool.setuptools.packages]
find = { include = ["collab_splats", "collab_splats.*"] }

[build-system]
# setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
# which setuptools 70+ removed (pkg_resources.packaging dropped as a submodule).
# The standalone `packaging` package is still available; only the shim was removed.
# Do not upgrade past 69.x until maskclip_onnx is updated or replaced.
requires = ["setuptools<70.0"]
build-backend = "setuptools.build_meta"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501"]
exclude = [".venv"]

[tool.nbqa.addopts]
flake8 = [
    "--extend-ignore=E203,E501"
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "build"

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=tests/test_meshlib.py"
testpaths = ["./tests"]
pythonpath = ["."]
markers = [
    "slow: requires network access or GPU (deselect with -m 'not slow')",
]

[tool.isort]
profile = "black"
skip_gitignore = true