[project]
name = "collab_splats"
version = "0.0.1"
description = "ns-extension: Extension tools and models for nerfstudio"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["gaussian splatting", "depth rasterization", "mesh"]
authors = [
    { name = "Tommy Botch", email = "tommy@basis.ai" },
]

dependencies = [
    # Cross-platform, pure-Python core shared by every entry point. Anything needing
    # CUDA, a compiler, or the reconstruction stack now lives in an extra — see
    # [project.optional-dependencies]. This is what makes `collab_splats[semantics]`
    # installable on macOS/CPU, where no +cu121 wheel exists at all.
    #
    # NOTE: this list was previously the full CUDA stack. `uv sync --all-extras`
    # (setup.sh) and the Docker build are unaffected — everything moved into the
    # `splatting` extra below, and --all-extras selects it.
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow",
    "pyyaml",
    "tqdm",
    "requests",
    "python-dotenv",
    "mergedeep",
    "matplotlib",
    "hydra-core",
    "omegaconf",
]

[project.optional-dependencies]

semantics = [
    # Feature extraction (Talk2DINO / DINO / MaskCLIP), segmentation, and the
    # FeatureAutoencoder — importable and runnable with no CUDA, no compiler, and no
    # reconstruction stack — for downstream consumers that only need to extract and
    # query features (e.g. on rendered views of an existing mesh).
    #
    # Deliberately accelerator-agnostic: plain `torch`, NOT the `torch==2.5.1+cu121`
    # pin in `splatting`, so this resolves on macOS/MPS and CPU-only Linux. Selecting
    # [semantics,splatting] together still resolves to the cu121 build (2.5.1 satisfies
    # >=2.1), so the GPU path is unchanged.
    #
    # The heavy backends — mobile_sam, maskclip_onnx, sam3, sklearn — are deliberately
    # NOT here. Each is imported lazily at first use, so `import collab_splats.semantics`
    # succeeds without them and only the backend you actually construct needs its dep.
    "torch>=2.1",
    "torchvision",
    "transformers>=4.30,<5.0",
    "timm>=0.9,<2.0",
    "huggingface_hub",
    "zarr>=2.16",
    "numcodecs",
    "opencv-python",
    "scikit-learn",
    # OpenAI CLIP (git source below, NOT the unrelated PyPI `clip`). Required at model-load
    # time: the Talk2DINOv3 HF repo ships remote code whose check_imports() hard-requires it,
    # so AutoModel.from_pretrained fails without it. Pure Python (torch/ftfy/regex/tqdm).
    "clip",
    # einops: same story — required by the Talk2DINOv3 remote modeling file's check_imports().
    "einops",
]

splatting = [
    # The former contents of [project].dependencies: the CUDA / gaussian-splatting /
    # reconstruction stack. Everything here was in base before and is unchanged —
    # only its location moved, so `uv sync --all-extras` produces the same env.
    #
    # setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
    # which setuptools 70+ removed. See [build-system] comment.
    "setuptools<70.0",
    # wheel + ninja must be IN the venv (not build-extras): bae/gsplat build with
    # no-build-isolation, which uses the project venv as the build env. Without wheel,
    # setuptools<70 has no bdist_wheel command. ninja gives fast parallel CUDA compiles.
    "wheel",
    "ninja",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "einops",
    "ftfy",
    "gdown",
    "lightning",
    "zarr>=2.16",
    "numcodecs",
    "regex",
    "huggingface_hub",
    "ultralytics",
    "gradio",
    "pyvista[jupyter]",
    # viser — websocket 3D viewer for live scene visualization (collab_splats/viewer.py)
    "viser>=1.0",
    "pyntcloud",
    "trame",
    "trame-vuetify",
    "trame-vtk",
    "meshlib>=3.1",
    "onnxruntime",
    "trimesh",
    "pydantic==2.10.6",
    "pycolmap>=3.1",
    "transformers>=4.30,<5.0",
    "timm>=0.9,<2.0",
    "opencv-python",
    "torchcodec",
    "scikit-learn",
    "roma",
    "kornia",
    # LoMa sparse matcher (ECCV 2026) — localization extractor alternative to DISK/XFeat.
    # Declares torchvision>=0.23; neutralized by the torchvision override below.
    "lomatch>=1.0.0",
    "open-clip-torch",
    "mobile_sam",
    # torchpack: implicit dep of mobilesamv2 (loaded via torch.hub for SAM segmentation).
    # mobilesamv2/efficientvit/models/nn/drop.py imports torchpack.distributed at module level,
    # so it must be installed before any import of mobilesamv2.
    "torchpack",
    # gsplat-rade fork (version 1.4.0) must be pre-installed with --no-build-isolation.
    # Pre-installed in Dockerfile builder stage.
    "gsplat",
    "maskclip_onnx",
    # pypose<0.9 required: pypose 0.9+ adds _ensure_sparse_backend_version() which runs at
    # `import pypose` and hard-rejects any bae != 0.2 (strict version.parse inequality), so it
    # raises ImportError against our pinned bae 0.2.4. The guard is absent in <=0.7.5 (no 0.8.x
    # exists). We use only pp.SE3 / pp.mat2SE3 / pp.optim (stable since 0.4), so the older line
    # is functionally equivalent. Upper bound, not an exact pin, so patch releases still float.
    "pypose<0.9",
    # cuDSS runtime dep for bae. Must be declared before bae for clarity (pip installs
    # wheels before source builds regardless of order, so cudss headers are present when
    # bae's find_cudss_root() runs at compile time). Pinned for ABI stability.
    "nvidia-cudss-cu12==0.6.0.5",
    # bae: pypose BA CUDA extension. Source pinned via [tool.uv.sources]; PyPI 'bae' (2.0.x) is a
    # different package. Built with no-build-isolation (see [tool.uv]) against the pip cuda-toolkit
    # nvcc — CUDA_HOME is wired to the venv's nvidia/cuda_nvcc dir in setup.sh.
    # USE_CUDSS defaults to "1" in bae 0.2.4.
    "bae",
    # nerfstudio: BasisResearch fork (our own) with gsplat-rade + cu121 patches applied.
    # @main tracks our fork's main branch — we control what lands there.
    "nerfstudio",
    "clip",
    # NOTE: the `file:///workspace/...` local-path dependency that used to end this
    # list was dropped. It is a Docker-image-absolute path that fails to resolve on
    # any other machine, and setup.sh already installs that package explicitly
    # post-sync ("kept out of the locked graph"). Keeping it here contradicted that
    # comment and made the project uninstallable outside the image.
]
feedforward = [
    # vggt-x and mapanything — git deps, install via setup/feedforward.sh
    # vggt @ third_party/VGGT-X submodule (--no-deps, pinned commit)
    # mapanything @ git+https://github.com/facebookresearch/map-anything.git (--no-deps)
    # lightglue @ git+https://github.com/cvg/LightGlue.git (--no-deps, mapanything colmap extra)
    "uniception==0.1.7",
    "viser>=0.2.23",
    "evo",
    "pyliblzfse",
    "safetensors",
    "natsort",
    "orjson",
    "pillow-heif",
    "plyfile",
    "tensorboard",
    "python-box",
    "open3d",
    "gtsam-develop",
    # salad (Dominic101/salad) source pinned via [tool.uv.sources].
    # pytorch-metric-learning is salad's only non-torch runtime dep.
    "pytorch-metric-learning",
    "vggt",
    "vggt-omega",
    "mapanything",
    "lightglue",
    "salad",
    "co3d",
]

gpu = [
  # CUDA build toolkit (nvcc + cccl headers) for compiling bae/gsplat in the venv.
  # 12.1.1 matches torch 2.5.1+cu121. torch already vendors the runtime libs.
  "cuda-toolkit[all]==12.1.1",
]

dashboard = [
  "panel>=1.3.0",
  "param>=2.0.0",
]

docs = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
]

dev = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "mypy",
  "ruff",
  "nbval",
  "nbqa",
  "black",
  "isort",
  "flake8>=6.0",
  "types-PyYAML",
]

[tool.black]
line-length = 120

[project.scripts]
collab-dashboard = "collab_splats.dashboard.__main__:main"

[project.entry-points."nerfstudio.method_configs"]
rade-gs = "collab_splats.nerfstudio.method_configs.rade_gs:rade_gs_method"
rade-features = "collab_splats.nerfstudio.method_configs.rade_features:rade_features_method"

[tool.setuptools.packages]
find = { include = ["collab_splats", "collab_splats.*"] }

[build-system]
# setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
# which setuptools 70+ removed (pkg_resources.packaging dropped as a submodule).
# The standalone `packaging` package is still available; only the shim was removed.
# Do not upgrade past 69.x until maskclip_onnx is updated or replaced.
requires = ["setuptools<70.0"]
build-backend = "setuptools.build_meta"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501"]
exclude = [".venv"]

[tool.nbqa.addopts]
flake8 = [
    "--extend-ignore=E203,E501"
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "build"

[tool.pytest.ini_options]
# importlib mode: avoids prepending test parent dirs to sys.path. (The old
# tests/nerfstudio/ shadow is fixed by renaming the dir to tests/nerfstudio_methods/.)
# --doctest-modules removed: no doctests in codebase; it scanned all importable
# CUDA modules causing multi-minute startup.
addopts = "--ignore=tests/test_meshlib.py --import-mode=importlib"
testpaths = ["./tests"]
pythonpath = ["."]
markers = [
    "slow: requires network access or GPU (deselect with -m 'not slow')",
]

[tool.isort]
profile = "black"
skip_gitignore = true

##############################
# uv configuration
##############################

[tool.uv]
# Force the cu121 torch stack + numpy>=2 regardless of what transitive deps pin.
# Replaces the per-package `--no-deps` hacks in the old setup scripts:
#   VGGT-X pinned torch==2.3.1; vggt-omega pinned numpy<2.
override-dependencies = [
    # Platform-split, like [tool.uv.sources] below. uv applies these overrides whenever the
    # cwd is inside this project (even for `uv pip install` into another venv), and no
    # +cu121 wheel exists for macOS, so an unconditional pin makes the `semantics` extra
    # unresolvable there. An override REPLACES the requirement outright, so a marker that
    # is false on a platform would drop torch from the resolve entirely — hence the
    # complementary darwin entries rather than a single gated pin. Linux/Windows is unchanged.
    "torch==2.5.1+cu121; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch>=2.1; sys_platform == 'darwin'",
    "torchvision==0.20.1+cu121; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision; sys_platform == 'darwin'",
    "numpy>=2,<2.2",
    # lomatch declares the py3.6 `dataclasses` backport unconditionally; never install it.
    "dataclasses>=0.8; python_version < '3.7'",
]
# bae + gsplat-rade import torch at build time → must build without isolation.
no-build-isolation-package = ["bae", "gsplat"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
# Platform-gated: the cu121 index only publishes linux_x86_64 / win_amd64 wheels, so an
# unconditional pin makes the project unresolvable on macOS — including for the CUDA-free
# `semantics` extra, since uv honours [tool.uv.sources] when installing from a local path.
# Gating by sys_platform leaves the Linux/Docker resolve byte-identical while letting
# `collab_splats[semantics]` fall through to PyPI torch on macOS.
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
gsplat = { git = "https://github.com/brian-xu/gsplat-rade.git" }
mobile_sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }
maskclip_onnx = { git = "https://github.com/RogerQi/maskclip_onnx.git" }
bae = { git = "https://github.com/pypose/bae.git", rev = "0.2.4" }
nerfstudio = { git = "https://github.com/BasisResearch/nerfstudio.git", branch = "main" }
clip = { git = "https://github.com/openai/CLIP.git" }
vggt = { git = "https://github.com/Linketic/VGGT-X.git", rev = "26d1b956cfda6f83926adda9f5c2c53f75dda749" }
vggt-omega = { git = "https://github.com/facebookresearch/vggt-omega.git", rev = "39a0cb8" }
mapanything = { git = "https://github.com/facebookresearch/map-anything.git" }
lightglue = { git = "https://github.com/cvg/LightGlue.git" }
salad = { git = "https://github.com/Dominic101/salad.git" }
co3d = { git = "https://github.com/facebookresearch/co3d.git" }