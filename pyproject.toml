[project]
name = "collab_splats"
version = "0.0.1"
description = "ns-extension: Extension tools and models for nerfstudio"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["gaussian splatting", "depth rasterization", "mesh"]
authors = [
    { name = "Tommy Botch", email = "tommy@basis.ai" },
]

dependencies = [
    # setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
    # which setuptools 70+ removed. See [build-system] comment.
    "setuptools<70.0",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "einops",
    "ftfy",
    "gdown",
    "matplotlib",
    "mergedeep",
    "numpy>=1.26",
    "zarr>=2.16",
    "numcodecs",
    "scipy>=1.11",
    "lightning",
    "pillow",
    "regex",
    "tqdm",
    "huggingface_hub",
    "ultralytics",
    "gradio",
    "pyvista[jupyter]",
    "pyntcloud",
    "trame",
    "trame-vuetify",
    "trame-vtk",
    "meshlib>=3.1",
    "python-dotenv",
    "hydra-core",
    "omegaconf",
    "onnxruntime",
    "requests",
    "trimesh",
    "pydantic==2.10.6",
    "pyyaml",
    "pycolmap>=3.1",
    "transformers>=4.30,<5.0",
    "timm>=0.9,<2.0",
    "opencv-python",
    "torchcodec",
    "scikit-learn",
    "roma",
    "kornia",
    "open-clip-torch",
    "mobile_sam",
    # torchpack: implicit dep of mobilesamv2 (loaded via torch.hub for SAM segmentation).
    # mobilesamv2/efficientvit/models/nn/drop.py imports torchpack.distributed at module level,
    # so it must be installed before any import of mobilesamv2.
    "torchpack",
    # gsplat-rade fork (version 1.4.0) must be pre-installed with --no-build-isolation.
    # Pre-installed in Dockerfile builder stage.
    "gsplat",
    "maskclip_onnx",
    # pypose<0.9 required: pypose 0.9+ adds _ensure_sparse_backend_version() which runs at
    # `import pypose` and hard-rejects any bae != 0.2 (strict version.parse inequality), so it
    # raises ImportError against our pinned bae 0.2.4. The guard is absent in <=0.7.5 (no 0.8.x
    # exists). We use only pp.SE3 / pp.mat2SE3 / pp.optim (stable since 0.4), so the older line
    # is functionally equivalent. Upper bound, not an exact pin, so patch releases still float.
    "pypose<0.9",
    # cuDSS runtime dep for bae. Must be declared before bae for clarity (pip installs
    # wheels before source builds regardless of order, so cudss headers are present when
    # bae's find_cudss_root() runs at compile time). Pinned for ABI stability.
    "nvidia-cudss-cu12==0.6.0.5",
    # bae: pypose BA CUDA extension. Pinned git URL avoids PyPI 'bae' (2.0.x) collision.
    # Pre-installed by setup.sh pre-step with --no-build-isolation before `pip install -e .`.
    # PIP_NO_BUILD_ISOLATION=1 does NOT propagate to dependency builds, so bae must be
    # installed explicitly first. CUDA_HOME=/opt/conda/envs/reconstruction required (nvcc lives
    # in the conda env, not /usr/local/cuda which is runtime-only in the Docker image).
    # USE_CUDSS defaults to "1" in bae 0.2.4.
    "bae",
    # nerfstudio: BasisResearch fork (our own) with gsplat-rade + cu121 patches applied.
    # @main tracks our fork's main branch — we control what lands there.
    "nerfstudio",
    "clip",
]

[project.optional-dependencies]
feedforward = [
    # vggt-x and mapanything — git deps, install via setup/feedforward.sh
    # vggt @ third_party/VGGT-X submodule (--no-deps, pinned commit)
    # mapanything @ git+https://github.com/facebookresearch/map-anything.git (--no-deps)
    # lightglue @ git+https://github.com/cvg/LightGlue.git (--no-deps, mapanything colmap extra)
    "uniception==0.1.7",
    "viser>=0.2.23",
    "evo",
    "pyliblzfse",
    "safetensors",
    "natsort",
    "orjson",
    "pillow-heif",
    "plyfile",
    "tensorboard",
    "python-box",
    "open3d",
    "gtsam-develop",
    # salad (Dominic101/salad) installed via setup/feedforward.sh.
    # pytorch-metric-learning is salad's only non-torch runtime dep.
    "pytorch-metric-learning",
    "vggt",
    "vggt-omega",
    "mapanything",
    "lightglue",
    "salad",
    "co3d",
]

gpu = [
  # CUDA build toolkit (nvcc + cccl headers) for compiling bae/gsplat in the venv.
  # 12.1.1 matches torch 2.5.1+cu121. torch already vendors the runtime libs.
  "cuda-toolkit[all]==12.1.1",
]

dashboard = [
  "panel>=1.3.0",
  "param>=2.0.0",
]

docs = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
]

dev = [
  "setuptools",
  "sphinx",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "myst-parser",
  "nbsphinx",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "pytest-asyncio",  # drives FastAPI/ASGI async webapp tests (asyncio_mode="auto")
  "httpx",           # AsyncClient + ASGITransport in tests/webapp/
  "mypy",
  "ruff",
  "nbval",
  "nbqa",
  "black",
  "isort",
  "flake8>=6.0",
  "types-PyYAML",
]

[tool.black]
line-length = 120

[project.scripts]
collab-dashboard = "collab_splats.dashboard.__main__:main"

[project.entry-points."nerfstudio.method_configs"]
rade-gs = "collab_splats.nerfstudio.method_configs.rade_gs:rade_gs_method"
rade-features = "collab_splats.nerfstudio.method_configs.rade_features:rade_features_method"

[tool.setuptools.packages]
find = { include = ["collab_splats", "collab_splats.*"] }

[build-system]
# setuptools<70.0 required: maskclip_onnx uses `from pkg_resources import packaging`,
# which setuptools 70+ removed (pkg_resources.packaging dropped as a submodule).
# The standalone `packaging` package is still available; only the shim was removed.
# Do not upgrade past 69.x until maskclip_onnx is updated or replaced.
requires = ["setuptools<70.0"]
build-backend = "setuptools.build_meta"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "E501"]
exclude = [".venv"]

[tool.nbqa.addopts]
flake8 = [
    "--extend-ignore=E203,E501"
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "build"

[tool.pytest.ini_options]
# importlib mode: avoids prepending test parent dirs to sys.path. (The old
# tests/nerfstudio/ shadow is fixed by renaming the dir to tests/nerfstudio_methods/.)
# --doctest-modules removed: no doctests in codebase; it scanned all importable
# CUDA modules causing multi-minute startup.
addopts = "--ignore=tests/test_meshlib.py --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["./tests"]
pythonpath = ["."]
markers = [
    "slow: requires network access or GPU (deselect with -m 'not slow')",
]

[tool.isort]
profile = "black"
skip_gitignore = true

##############################
# uv configuration
##############################

[tool.uv]
# Force the cu121 torch stack + numpy>=2 regardless of what transitive deps pin.
# Replaces the per-package `--no-deps` hacks in the old setup scripts:
#   VGGT-X pinned torch==2.3.1; vggt-omega pinned numpy<2.
override-dependencies = [
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "numpy>=2,<2.2",
]
# bae + gsplat-rade import torch at build time → must build without isolation.
no-build-isolation-package = ["bae", "gsplat"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
gsplat = { git = "https://github.com/brian-xu/gsplat-rade.git" }
mobile_sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }
maskclip_onnx = { git = "https://github.com/RogerQi/maskclip_onnx.git" }
bae = { git = "https://github.com/pypose/bae.git", rev = "0.2.4" }
nerfstudio = { git = "https://github.com/BasisResearch/nerfstudio.git", branch = "main" }
clip = { git = "https://github.com/openai/CLIP.git" }
vggt = { path = "third_party/VGGT-X", editable = true }
vggt-omega = { path = "third_party/vggt-omega", editable = true }
mapanything = { git = "https://github.com/facebookresearch/map-anything.git" }
lightglue = { git = "https://github.com/cvg/LightGlue.git" }
salad = { git = "https://github.com/Dominic101/salad.git" }
co3d = { git = "https://github.com/facebookresearch/co3d.git" }
collab-data = { git = "https://github.com/BasisResearch/collab-data.git" }